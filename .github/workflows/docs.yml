# Publica la documentación en GitHub Pages (https://ffunes-cru.github.io/cotizador/) con cada push a la rama
# principal, o a mano desde Actions → Documentación → Run workflow. Es el mismo sitio que se arma en local
# (ver docs/operacion.md, Comandos frecuentes): MkDocs con los docs/*.md y el código de Doxygen.
name: Documentación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Armar el sitio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq doxygen > /dev/null
          doxygen docs/Doxyfile > /dev/null
          uvx --with mkdocs-material==9.6.14 --with mkdocs-include-markdown-plugin==7.1.5 mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
